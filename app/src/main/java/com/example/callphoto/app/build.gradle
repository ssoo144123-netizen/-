plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.callphoto'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.callphoto"
        minSdk 21
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
